# Aegis — Deploy: Gated Azure Deployment
#
# GUARDRAILS:
#   - Deployment ALWAYS requires GitHub Environment approval.
#   - Manual trigger (workflow_dispatch) is always available.
#   - Auto trigger (push to main) is opt-in and STILL requires approval.
#   - Deployment mode is ALWAYS Incremental (never Complete).
#   - A what-if preview is generated before deployment for human review.
#   - Default behaviour is generate-only — this workflow only runs when
#     explicitly configured via deploy mode.
#
# SAFE DEFAULTS:
#   - This workflow does NOT run on push by default.
#   - The push trigger is commented out. Uncomment ONLY if deploy mode is 'auto'.
#   - Even with auto trigger, Environment approval is mandatory.

name: Deploy

on:
  # Manual trigger — always available for 'manual' and 'auto' deploy modes
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      dry_run:
        description: 'Dry run (what-if only, no deploy)'
        required: true
        default: true
        type: boolean

  # Auto trigger — UNCOMMENT ONLY if deploy mode is 'auto'
  # Even with this trigger, the Environment approval gate is mandatory.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infra/**'

permissions:
  contents: read
  id-token: write  # Required for OIDC federation with Azure

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    # CRITICAL: Environment approval gate — human must approve before deploy
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: Configure OIDC federation for Azure login (no stored secrets)

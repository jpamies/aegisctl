# Aegis — IaC Validation: Bicep Lint & Build
# Azure DevOps pipeline that validates Bicep templates without deploying.
# Triggered on changes to the infra/ directory.

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'infra/*'

pr:
  branches:
    include:
      - main
  paths:
    include:
      - 'infra/*'

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: AzureCLI@2
    displayName: 'Install Bicep CLI'
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az bicep install
        az bicep version

  - task: AzureCLI@2
    displayName: 'Bicep lint'
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az bicep lint --file infra/main.bicep

  - task: AzureCLI@2
    displayName: 'Bicep build (validate)'
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az bicep build --file infra/main.bicep --stdout > /dev/null
        echo "Bicep template compiled successfully."

  - task: AzureCLI@2
    displayName: 'What-if preview (dry run)'
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "What-if preview (requires AZURE_RESOURCE_GROUP variable):"
        # az deployment group what-if \
        #   --resource-group $(AZURE_RESOURCE_GROUP) \
        #   --template-file infra/main.bicep \
        #   --parameters infra/parameters.dev.json
    continueOnError: true

# Aegis — Release: Build binaries and publish to GitHub Releases
#
# This pipeline builds cross-platform binaries in Azure DevOps and
# creates a GitHub Release with the assets available for download.
#
# Trigger: tags matching v* (e.g., v0.3.0)
# Requires: GitHub service connection named 'github-release'

trigger:
  tags:
    include:
      - 'v*'

pool:
  vmImage: 'ubuntu-latest'

variables:
  GO_VERSION: '1.22'
  SRC_DIR: 'src'

stages:
  - stage: Build
    displayName: 'Build Release Binaries'
    jobs:
      - job: CrossCompile
        displayName: 'Cross-compile all platforms'
        steps:
          - task: GoTool@0
            displayName: 'Set up Go $(GO_VERSION)'
            inputs:
              version: '$(GO_VERSION)'

          - script: go test -race ./...
            displayName: 'Run tests'
            workingDirectory: $(SRC_DIR)

          - script: |
              TAG=$(Build.SourceBranchName)
              echo "##vso[task.setvariable variable=RELEASE_TAG]$TAG"
              echo "Building release: $TAG"

              mkdir -p $(Build.ArtifactStagingDirectory)/release

              # Linux amd64
              GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-linux-amd64 ./cmd/aegisctl

              # Linux arm64
              GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-linux-arm64 ./cmd/aegisctl

              # macOS amd64
              GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-darwin-amd64 ./cmd/aegisctl

              # macOS arm64 (Apple Silicon)
              GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-darwin-arm64 ./cmd/aegisctl

              # Windows amd64
              GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-windows-amd64.exe ./cmd/aegisctl

              # Windows arm64
              GOOS=windows GOARCH=arm64 go build -ldflags "-s -w" \
                -o $(Build.ArtifactStagingDirectory)/release/aegisctl-windows-arm64.exe ./cmd/aegisctl
            displayName: 'Cross-compile binaries'
            workingDirectory: $(SRC_DIR)

          - script: |
              cd $(Build.ArtifactStagingDirectory)/release
              sha256sum * > checksums-sha256.txt
              cat checksums-sha256.txt
            displayName: 'Generate checksums'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish release artefacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/release'
              ArtifactName: 'release'
              publishLocation: 'Container'

  - stage: Release
    displayName: 'Publish GitHub Release'
    dependsOn: Build
    jobs:
      - job: GitHubRelease
        displayName: 'Create GitHub Release'
        steps:
          - task: DownloadBuildArtifacts@1
            displayName: 'Download release artefacts'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'release'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: GitHubRelease@1
            displayName: 'Create GitHub Release'
            inputs:
              gitHubConnection: 'github-release'
              repositoryName: '$(Build.Repository.Name)'
              action: 'create'
              target: '$(Build.SourceVersion)'
              tagSource: 'gitTag'
              tagPattern: 'v.*'
              title: 'aegisctl $(Build.SourceBranchName)'
              releaseNotesSource: 'inline'
              releaseNotesInline: |
                ## aegisctl $(Build.SourceBranchName)

                Azure architecture advisor — powered by the Well-Architected Framework + GitHub Copilot.

                ### Downloads

                | Platform | Binary |
                |---|---|
                | Linux amd64 | `aegisctl-linux-amd64` |
                | Linux arm64 | `aegisctl-linux-arm64` |
                | macOS amd64 | `aegisctl-darwin-amd64` |
                | macOS arm64 (Apple Silicon) | `aegisctl-darwin-arm64` |
                | Windows amd64 | `aegisctl-windows-amd64.exe` |
                | Windows arm64 | `aegisctl-windows-arm64.exe` |

                ### Verify checksums

                ```bash
                sha256sum -c checksums-sha256.txt
                ```
              assets: '$(System.ArtifactsDirectory)/release/*'
              isDraft: false
              isPreRelease: false
              addChangeLog: true
              changeLogCompareToRelease: 'lastFullRelease'
              changeLogType: 'commitBased'

# Aegis — Deploy: Approval-Gated Azure Deployment
#
# GUARDRAILS:
#   - Deployment ALWAYS requires Environment approval in Azure DevOps.
#   - Manual trigger (pipeline run) is always available.
#   - Deployment mode is ALWAYS Incremental (never Complete).
#   - A what-if preview is generated before deployment for human review.
#   - Default behaviour is generate-only — this pipeline only runs when
#     explicitly configured via deploy mode.
#
# SAFE DEFAULTS:
#   - CI trigger is disabled. Run manually or configure as needed.
#   - Even with triggers, Environment approval is mandatory.

trigger: none  # Manual trigger only — enable CI trigger when ready

parameters:
  - name: environment
    displayName: 'Target environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - production
  - name: dryRun
    displayName: 'Dry run (what-if only, no deploy)'
    type: boolean
    default: true

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Preview
    displayName: 'What-If Preview'
    jobs:
      - job: WhatIf
        displayName: 'Azure What-If'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'What-if preview'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Environment: ${{ parameters.environment }}"
                PARAMS_FILE="infra/parameters.${{ parameters.environment }}.json"
                az deployment group what-if \
                  --resource-group $(AZURE_RESOURCE_GROUP)-${{ parameters.environment }} \
                  --template-file infra/main.bicep \
                  --parameters $PARAMS_FILE \
                  --mode Incremental

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Preview
    condition: and(succeeded(), eq('${{ parameters.dryRun }}', false))
    jobs:
      - deployment: DeployAzure
        displayName: 'Deploy (Incremental)'
        # CRITICAL: Environment approval gate — human must approve before deploy
        environment: '${{ parameters.environment }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Deploy (Incremental mode ONLY)'
                  inputs:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Deploying to: ${{ parameters.environment }}"
                      echo "IMPORTANT: Mode is ALWAYS Incremental — never Complete"
                      PARAMS_FILE="infra/parameters.${{ parameters.environment }}.json"
                      az deployment group create \
                        --resource-group $(AZURE_RESOURCE_GROUP)-${{ parameters.environment }} \
                        --template-file infra/main.bicep \
                        --parameters $PARAMS_FILE \
                        --mode Incremental

                - script: |
                    echo "========================================="
                    echo "Deployment complete"
                    echo "Environment: ${{ parameters.environment }}"
                    echo "Mode: Incremental"
                    echo "========================================="
                  displayName: 'Deployment summary'
